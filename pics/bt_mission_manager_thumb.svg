<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Behavior Tree Mission Manager</title>
  <desc id="d">Mission orchestration feeds a Behavior Tree supervisor, which coordinates flight control, mission state, and payload coordination.</desc>

  <rect width="480" height="270" fill="#151e27"/>

  <!-- Mission Orchestration -->
  <rect x="140" y="20" width="200" height="42" rx="8" fill="#1b2631" stroke="#d6e3e0" stroke-opacity=".16"/>
  <text x="240" y="46" fill="#a9b6b7" font-size="15" text-anchor="middle">Mission Orchestration</text>

  <line x1="240" y1="62" x2="240" y2="88" stroke="#a9b6b7" stroke-width="1.6"/>
  <polygon points="240,88 235,79 245,79" fill="#a9b6b7"/>

  <!-- Behavior Tree Supervisor -->
  <rect x="100" y="88" width="280" height="52" rx="9" fill="#1b2631" stroke="#65b8aa" stroke-opacity=".55" stroke-width="1.4"/>
  <text x="240" y="120" fill="#f1f5f2" font-size="17" font-weight="700" text-anchor="middle">Behavior Tree Supervisor</text>

  <!-- fan-out -->
  <line x1="180" y1="140" x2="95" y2="186" stroke="#a9b6b7" stroke-width="1.6"/>
  <polygon points="90,192 99.8,191 95.8,184" fill="#a9b6b7"/>

  <line x1="240" y1="140" x2="240" y2="186" stroke="#a9b6b7" stroke-width="1.6"/>
  <polygon points="240,192 235,183 245,183" fill="#a9b6b7"/>

  <line x1="300" y1="140" x2="385" y2="186" stroke="#a9b6b7" stroke-width="1.6"/>
  <polygon points="390,192 380.2,191 384.2,184" fill="#a9b6b7"/>

  <!-- subsystems -->
  <rect x="22" y="192" width="136" height="58" rx="8" fill="#1b2631" stroke="#d6e3e0" stroke-opacity=".16"/>
  <text x="90" y="219" fill="#f1f5f2" font-size="13" text-anchor="middle">Flight</text>
  <text x="90" y="237" fill="#a9b6b7" font-size="13" text-anchor="middle">Control</text>

  <rect x="172" y="192" width="136" height="58" rx="8" fill="#1b2631" stroke="#d6e3e0" stroke-opacity=".16"/>
  <text x="240" y="219" fill="#f1f5f2" font-size="13" text-anchor="middle">Mission</text>
  <text x="240" y="237" fill="#a9b6b7" font-size="13" text-anchor="middle">State</text>

  <rect x="322" y="192" width="136" height="58" rx="8" fill="#1b2631" stroke="#d6e3e0" stroke-opacity=".16"/>
  <text x="390" y="219" fill="#f1f5f2" font-size="13" text-anchor="middle">Payload</text>
  <text x="390" y="237" fill="#a9b6b7" font-size="13" text-anchor="middle">Coordination</text>
</svg>
