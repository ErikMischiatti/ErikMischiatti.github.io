<svg viewBox="0 0 360 590" role="img" aria-labelledby="dgp-title dgp-desc">
  <title id="dgp-title">RTK base station, power path</title>
  <desc id="dgp-desc">Four 18650 cells feed the IP5310 charger and boost board. The metal power button switches its 5 volt output. The 5 volt rail feeds the Here4 Base, the Arduino Nano and the LM2596 step-down, which gives 3.3 volts to the LoRa radio.</desc>
  <defs>
    <marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-head"/></marker>
  </defs>
  <text class="dg-title" x="10" y="20">Power path</text>
  <path class="dg-power" d="M95 96 V146" marker-end="url(#ahp)"/>
  <path class="dg-data" d="M275 96 V178 H184" marker-end="url(#ahp)"/>
  <path class="dg-power" d="M40 206 V435"/>
  <path class="dg-power" d="M40 275 H76" marker-end="url(#ahp)"/>
  <path class="dg-power" d="M40 355 H76" marker-end="url(#ahp)"/>
  <path class="dg-power" d="M40 435 H76" marker-end="url(#ahp)"/>
  <path class="dg-power" d="M170 460 V516" marker-end="url(#ahp)"/>
  <text class="dg-note" x="104" y="126">cells</text>
  <text class="dg-note" x="230" y="170" text-anchor="middle">switch</text>
  <text class="dg-note" x="50" y="232">5 V rail</text>
  <text class="dg-note" x="180" y="494">3.3 V</text>
  <g class="dg-box"><rect x="10" y="40" width="170" height="56"/><text class="dg-label" x="95" y="64">Battery</text><text class="dg-sub" x="95" y="83">4 × 18650 Li-ion</text></g>
  <g class="dg-box"><rect x="200" y="40" width="150" height="56"/><text class="dg-label" x="275" y="64">Power button</text><text class="dg-sub" x="275" y="83">metal, LED ring</text></g>
  <g class="dg-box"><rect x="10" y="150" width="170" height="56"/><text class="dg-label" x="95" y="174">Charger / boost</text><text class="dg-sub" x="95" y="193">IP5310, USB-C input</text></g>
  <g class="dg-box"><rect x="80" y="250" width="180" height="50"/><text class="dg-label" x="170" y="272">Here4 Base</text><text class="dg-sub" x="170" y="290">5 V</text></g>
  <g class="dg-box"><rect x="80" y="330" width="180" height="50"/><text class="dg-label" x="170" y="352">Arduino Nano</text><text class="dg-sub" x="170" y="370">5 V</text></g>
  <g class="dg-box"><rect x="80" y="410" width="180" height="50"/><text class="dg-label" x="170" y="432">Step-down</text><text class="dg-sub" x="170" y="450">LM2596, 5 → 3.3 V</text></g>
  <g class="dg-box"><rect x="80" y="520" width="180" height="50"/><text class="dg-label" x="170" y="542">LoRa radio</text><text class="dg-sub" x="170" y="560">3.3 V</text></g>
</svg>
